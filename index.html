<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>東海岸海盜船長的淨海藏寶圖</title>
<style>
  :root {
    --navy: #0f2942;
    --ocean: #1b6ca8;
    --teal: #2a9d8f;
    --gold: #e9c46a;
    --amber: #f4a261;
    --coral: #e76f51;
    --bg: #f0f4f8;
    --card: #ffffff;
    --text: #1e293b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  body { background-color: #1e293b; display: flex; justify-content: center; min-height: 100vh; color: var(--text); }
  
  /* 模擬手機框架，方便簡報投影展示 */
  .app-container {
    width: 100%;
    max-width: 430px;
    background-color: var(--bg);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    position: relative;
    box-shadow: 0 0 25px rgba(0,0,0,0.5);
    padding-bottom: 75px;
  }

  /* 頂部船長儀表板 */
  header {
    background: linear-gradient(135deg, var(--navy), var(--ocean));
    color: white;
    padding: 16px;
    border-bottom-left-radius: 20px;
    border-bottom-right-radius: 20px;
    box-shadow: 0 4px 12px rgba(15,41,66,0.2);
  }
  .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .team-badge { background: rgba(255,255,255,0.15); padding: 4px 10px; border-radius: 20px; font-size: 13px; display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .reset-btn { background: rgba(231,111,81,0.85); border: none; color: white; padding: 4px 8px; border-radius: 6px; font-size: 11px; cursor: pointer; }
  
  .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
  .stat-box { background: rgba(255,255,255,0.12); padding: 8px 4px; border-radius: 12px; }
  .stat-val { font-size: 18px; font-weight: bold; color: var(--gold); }
  .stat-label { font-size: 11px; opacity: 0.9; margin-top: 2px; }

  /* 內容區塊 */
  main { padding: 16px; flex: 1; overflow-y: auto; }
  .section { display: none; animation: fadeIn 0.25s ease; }
  .section.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

  /* 卡片與標題列 + 問號按鈕 */
  .card { background: var(--card); border-radius: 16px; padding: 16px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); border: 1px solid #e2e8f0; }
  .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 1px dashed #cbd5e1; padding-bottom: 8px; }
  .card-title { font-size: 16px; font-weight: 700; color: var(--navy); display: flex; align-items: center; gap: 6px; }
  
  /* 問號幫助按鈕 */
  .help-btn {
    width: 24px; height: 24px; border-radius: 50%;
    background: #e0f2fe; color: var(--ocean);
    border: 1.5px solid var(--ocean);
    font-weight: bold; font-size: 13px;
    display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0;
  }
  .help-btn:active { transform: scale(0.92); background: var(--ocean); color: white; }

  /* 按鈕與輸入框 */
  .btn {
    width: 100%; padding: 11px; border: none; border-radius: 10px;
    font-size: 14px; font-weight: 600; cursor: pointer;
    background: var(--ocean); color: white; transition: 0.2s;
    margin-top: 8px;
  }
  .btn:active { transform: scale(0.98); }
  .btn-gold { background: var(--amber); color: #1e293b; }
  .btn-teal { background: var(--teal); color: white; }
  .btn-coral { background: var(--coral); color: white; }
  .btn-outline { background: transparent; border: 1.5px solid var(--ocean); color: var(--ocean); }
  
  .input-group { display: flex; gap: 8px; margin-top: 8px; }
  input[type="text"] {
    flex: 1; padding: 10px; border: 1.5px solid #cbd5e1; border-radius: 10px;
    font-size: 14px; outline: none;
  }
  input[type="text"]:focus { border-color: var(--ocean); }

  /* 藏寶地圖節點 */
  .map-node { display: flex; gap: 12px; position: relative; padding-bottom: 18px; }
  .map-node:last-child { padding-bottom: 0; }
  .map-node::before {
    content: ""; position: absolute; left: 15px; top: 32px; bottom: 0;
    width: 2px; background: #cbd5e1;
  }
  .map-node:last-child::before { display: none; }
  .node-icon {
    width: 32px; height: 32px; border-radius: 50%; background: var(--navy); color: white;
    display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: bold; z-index: 1; flex-shrink: 0;
  }
  .node-icon.done { background: var(--teal); }
  .node-content { flex: 1; background: #f8fafc; padding: 10px 12px; border-radius: 12px; border: 1px solid #e2e8f0; }
  .node-top { display: flex; justify-content: space-between; align-items: center; }
  .node-name { font-weight: 700; font-size: 14px; color: var(--navy); }
  .node-desc { font-size: 12px; color: #64748b; margin-top: 4px; line-height: 1.4; }

  /* SUP 卡牌樣式 */
  .sup-card-box { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 0; }
  .fate-card {
    padding: 12px; border-radius: 12px; text-align: center; border: 2px solid #cbd5e1; background: #f8fafc;
  }
  .fate-card.buff { border-color: var(--teal); background: #f0fdfa; }
  .fate-card.debuff { border-color: var(--coral); background: #fef2f2; }
  .band-tag {
    display: inline-block; padding: 3px 8px; border-radius: 12px; font-size: 11px; font-weight: bold; margin-top: 6px; color: white;
  }

  /* NFC 小人網格 */
  .nfc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px; }
  .nfc-item {
    aspect-ratio: 1; border-radius: 12px; border: 1.5px dashed #94a3b8;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 12px; cursor: pointer; background: #f8fafc; color: #64748b;
  }
  .nfc-item.unlocked { border: 2px solid var(--teal); background: #ccfbf1; color: var(--navy); font-weight: bold; }

  /* 30秒拔旗戰計時器 */
  .timer-display {
    font-size: 36px; font-weight: 800; text-align: center; color: var(--coral);
    background: #fff1f2; padding: 10px; border-radius: 12px; margin: 10px 0;
  }
  .shop-list { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .shop-btn {
    padding: 8px; border-radius: 8px; border: 1px solid #cbd5e1; background: white;
    font-size: 12px; cursor: pointer; text-align: left;
  }
  .shop-btn.occupied { background: #fef3c7; border-color: var(--amber); font-weight: bold; }

  /* 結業證書 */
  .cert-box {
    background: linear-gradient(135deg, #fffbeb, #fef3c7);
    border: 4px double var(--amber); border-radius: 16px; padding: 20px; text-align: center;
    position: relative;
  }
  .cert-title { font-size: 20px; font-weight: 800; color: var(--navy); letter-spacing: 1px; }
  .cert-score { font-size: 32px; font-weight: 900; color: var(--coral); margin: 10px 0; }

  /* 底部導覽列 */
  nav {
    position: fixed; bottom: 0; width: 100%; max-width: 430px;
    background: white; display: grid; grid-template-columns: repeat(4, 1fr);
    border-top: 1px solid #e2e8f0; padding: 6px 0; z-index: 10;
  }
  .nav-item {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 11px; color: #64748b; cursor: pointer; padding: 4px; border: none; background: none;
  }
  .nav-item.active { color: var(--ocean); font-weight: bold; }
  .nav-icon { font-size: 20px; margin-bottom: 2px; }

  /* 彈出視窗 (Modal) */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(15,23,42,0.65);
    display: none; align-items: center; justify-content: center; z-index: 50; padding: 20px;
  }
  .modal-overlay.show { display: flex; }
  .modal-box {
    background: white; width: 100%; max-width: 360px; border-radius: 16px; padding: 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3); animation: popIn 0.2s ease;
  }
  @keyframes popIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .modal-title { font-size: 17px; font-weight: bold; color: var(--navy); margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
  .modal-body { font-size: 14px; line-height: 1.6; color: #334155; margin-bottom: 16px; }

  /* Demo 小抄折疊區 */
  .demo-cheat { font-size: 11px; color: #64748b; background: #e2e8f0; padding: 8px 12px; border-radius: 8px; margin-top: 10px; }
</style>
</head>
